services:
  postgres:
    # Pinned: the artifact's bm25 index and pdb.* casts restore only into the same
    # pg_search, and PG18's pg_dump writes \restrict lines older psql cannot read.
    # This is the 2026/10/29 image (PostgreSQL 18.6, pg_search 0.26.4, pgvector 0.8.6);
    # CourseLangChain's compose pins the same digest. Bump both together.
    image: paradedb/paradedb:latest@sha256:4abbafffb4e59e679821c5882faf91c494022bb3242fc73b789e753f43df1361
    ports:
      - "127.0.0.1:5433:5432"   # localhost only: the password is the default one
    environment:
      POSTGRES_DB: academic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d academic"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    volumes:
      - prepdata:/var/lib/postgresql/18/docker

  # Step 1: SQLite -> PostgreSQL, straight into the database above. Behind a
  # profile so it never starts alongside postgres — run it explicitly:
  #
  #   LOAD_SQLITE=/path/to/1151.db docker compose --profile load run --rm pgloader
  pgloader:
    # Pinned (3.6.10): prep.release reads its summary table to catch rejected rows.
    image: ghcr.io/dimitri/pgloader:latest@sha256:a1d4a78e78a64e46cd3fc7dfc57d24eb91ffb1a5520f2b1f55631815e3658d6e
    platform: linux/amd64
    profiles: ["load"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${LOAD_SQLITE:-./data.db}:/data/source.db:ro
    # Small batches: a full crawl (100k courses with syllabus text, ~200 MB) exhausts
    # pgloader's default heap ("Heap exhausted, game over") with the default batch sizes.
    command: >
      pgloader
      --with "prefetch rows = 2000" --with "batch rows = 2000" --with "workers = 2" --with "concurrency = 1"
      sqlite:///data/source.db
      postgresql://postgres:postgres@postgres:5432/academic

volumes:
  prepdata:
